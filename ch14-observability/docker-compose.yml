# Optional: Jaeger as a trace viewer, for when the text trees from graphspans.py
# aren't enough. Point OTEL_EXPORTER_OTLP_ENDPOINT at http://127.0.0.1:4318 instead
# of the collector. Jaeger doesn't redact anything, so use it only in development.
#   docker compose up -d
#   open http://localhost:16686
services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
